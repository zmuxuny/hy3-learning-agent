name: Deploy demo player to Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - pages/**
      - assets/demo/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir -p _site/media
          cp pages/index.html _site/index.html
          cp assets/demo/learning-agent-hy3-demo-cover.jpg _site/media/
          cp assets/demo/learning-agent-hy3-demo.mp4 _site/media/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
