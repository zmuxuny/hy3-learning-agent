name: Deploy demo player to Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - pages/**
      - scripts/build-demo-pages.py
      - evaluation/artifacts/decisionbench-final-method-20260910/automatic/**
      - 第三阶段项目与评测报告.html
      - assets/demo/**
      - assets/brand/**
      - 第三阶段Demo.mp4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          python3 scripts/build-demo-pages.py --output _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
