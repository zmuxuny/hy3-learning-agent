name: One-off README demo cover fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-demo-cover-oneoff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace unsupported inline video with clickable cover
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          old = '''## Demo（完整 108 秒，任务要求不超过 120 秒）\n\n<video controls preload="metadata" playsinline poster="https://raw.githubusercontent.com/zmuxuny/hy3-learning-agent/main/assets/demo/stage3/cover.png" width="960">\n  <source src="https://github.com/user-attachments/assets/c9193cc8-d6fb-4aab-a2d8-6b01633f598f" type="video/mp4" />\n</video>\n\n[▶ 在线观看108秒Demo（1080p）](https://zmuxuny.github.io/hy3-learning-agent/#demo) · [下载MP4](https://raw.githubusercontent.com/zmuxuny/hy3-learning-agent/main/第三阶段Demo.mp4) · [素材与复建](assets/demo/stage3/README.md)\n'''
          new = '''## Demo\n\n[![Learning Agent · Hy3 Demo](assets/demo/stage3/cover.png)](https://zmuxuny.github.io/hy3-learning-agent/#demo)\n\n[▶ 在线观看108秒Demo（1080p）](https://zmuxuny.github.io/hy3-learning-agent/#demo) · [下载MP4](https://raw.githubusercontent.com/zmuxuny/hy3-learning-agent/main/第三阶段Demo.mp4) · [素材与复建](assets/demo/stage3/README.md)\n'''
          if text.count(old) != 1:
              raise SystemExit('expected README demo block not found exactly once')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          grep -q '^## Demo$' README.md
          grep -q 'assets/demo/stage3/cover.png' README.md
          grep -q '在线观看108秒Demo' README.md
          if grep -q '<video' README.md; then
            echo 'unsupported video tag still present' >&2
            exit 1
          fi
          rm -f .github/workflows/readme-demo-cover-oneoff.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: show clickable demo cover in README"
          git push origin HEAD:main
