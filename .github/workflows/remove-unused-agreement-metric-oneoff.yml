name: One-off agreement metric removal

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-unused-agreement-metric-oneoff.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Remove the unused statistic from source, tests, docs, and archived text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io, json, re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Main report: only the agreement-statistics passage in 5.4 is changed.
          replace_once(
              '第三阶段项目与评测报告.md',
              '''在行动适度与副作用维度，**自动评分与人工参考的二次加权Kappa为1.000**：双方对47例给出2级、对1例给出1级，逐例判断全部相同。这表明评测器在本批材料中对行动是否适度的判断与人工参考一致。\n\n二次加权Kappa考虑双方等级分布带来的偶然一致，并对相差两档的分歧给予比相差一档更大的权重；1表示完全一致，0表示未超出由边际分布得到的偶然一致水平。用户控制维度双方对48例均给出2级，直接一致率为100%，但Kappa分母为0，记录为无定义。因此同时报告直接一致率与Kappa，并列出全部七个维度。\n''',
              '''本报告以**逐维等级一致率**和**评分是否达标的一致率**作为人工对齐的统计结果，并结合逐例差异分析判断分歧具体发生在哪里。\n'''
          )

          # Human-confirmation archive: direct agreement only.
          replace_once(
              'evaluation/artifacts/human-confirmation-20260910/README.md',
              '''## 自动评分与协商后参考的比较\n\n自动评分与最终参考在48例中的46例给出相同达标结论，一致率95.8%。[application-alignment.csv](application-alignment.csv)列出最终方法的七维一致率和二次加权Kappa；[application-human.csv](../decisionbench-final-method-20260910/automatic/application-human.csv)并列双方每例的等级、总分和结论。[confirmation.json](confirmation.json)保存两份标注、最终参考的文件摘要及全部比较结果。\n''',
              '''## 自动评分与协商后参考的比较\n\n自动评分与最终参考在48例中的46例给出相同达标结论，一致率95.8%。逐维直接一致率分别为：事实与内容正确性83.3%、学习目标与需求95.8%、行动选择与时机97.9%、约束与用户控制100%、结果可用性93.8%、行动适度与副作用100%、解释与下一步93.8%。[application-alignment.csv](application-alignment.csv)列出最终方法的七维直接一致率；[application-human.csv](../decisionbench-final-method-20260910/automatic/application-human.csv)并列双方每例的等级、总分和结论。[confirmation.json](confirmation.json)保存两份标注、最终参考的文件摘要及全部比较结果。\n'''
          )

          # Public index and archive descriptions.
          replace_once(
              '第三阶段交付说明.md',
              '| 自动与人工逐维一致性 | 7行，每行一个维度；包含48例的有效数量、等级一致率和二次加权Kappa | [evaluation/artifacts/decisionbench-final-method-20260910/automatic/human-alignment.csv](evaluation/artifacts/decisionbench-final-method-20260910/automatic/human-alignment.csv) |',
              '| 自动与人工逐维一致性 | 7行，每行一个维度；包含48例的有效数量和等级直接一致率 | [evaluation/artifacts/decisionbench-final-method-20260910/automatic/human-alignment.csv](evaluation/artifacts/decisionbench-final-method-20260910/automatic/human-alignment.csv) |'
          )
          replace_once(
              'evaluation/artifacts/decisionbench-final-method-20260910/README.md',
              '| [human-alignment.csv](automatic/human-alignment.csv) | 48个应用案例的逐维直接一致率与二次加权Kappa；无定义记空值 |',
              '| [human-alignment.csv](automatic/human-alignment.csv) | 48个应用案例的逐维直接一致率 |'
          )
          replace_once(
              '交付材料/README.md',
              '| 协商前一致性 | [human-human-alignment.csv](实验结果/人工一致性/human-human-alignment.csv)：逐维等级一致率及Kappa；[annotation-differences.csv](实验结果/人工一致性/annotation-differences.csv)：7处等级差异 |',
              '| 协商前一致性 | [human-human-alignment.csv](实验结果/人工一致性/human-human-alignment.csv)：逐维等级一致率；[annotation-differences.csv](实验结果/人工一致性/annotation-differences.csv)：7处等级差异 |'
          )

          # Earlier planning text: keep the plan readable but align it with the final metric choice.
          replace_once(
              '腾讯犀牛鸟开源实习第三阶段项目方案.md',
              '| 人工一致性 | 自动评测是否接近独立评审 | 双人盲标、逐维二次加权Kappa、通过结论一致率 |',
              '| 人工一致性 | 自动评测是否接近独立评审 | 双人盲标、逐维等级一致率、通过结论一致率 |'
          )
          p = Path('腾讯犀牛鸟开源实习第三阶段项目方案.md')
          text = p.read_text(encoding='utf-8')
          text, n = re.subn(r'^\| Hy3 Judge 与人工标签 Weighted Kappa \| ≥ 0\.60 \|\n', '', text, flags=re.M)
          if n != 1:
              raise SystemExit('expected project-plan target row not found exactly once')
          p.write_text(text, encoding='utf-8')

          replace_once(
              'evaluation/datasets/decisionbench-v1-candidate/DATASET_CARD.md',
              '这项内容验收没有实施独立人类盲标、Kappa、真实 Judge 或方法有效性实验。',
              '这项内容验收没有实施独立人类盲标、真实 Judge 或方法有效性实验。'
          )
          replace_once(
              'evaluation/datasets/decisionbench-v1-e6-test/README.md',
              '没有独立人类盲标或 Kappa。',
              '没有独立人类盲标。'
          )

          # Summarizers: stop calculating/exporting the statistic.
          p = Path('evaluation/scripts/summarize_human_confirmation.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('from collections import Counter\n', '')
          text, n = re.subn(r'\n\ndef kappa\(a, b\):.*?\n\ndef keyed\(rows\):', '\n\ndef keyed(rows):', text, flags=re.S)
          if n != 1:
              raise SystemExit('failed to remove agreement-correction function')
          old = '''        dimensions.append(dict(dimension=d, n=len(ids), matches=sum(u == v for u, v in zip(x, y)),\n                               agreement=sum(u == v for u, v in zip(x, y))/len(ids), quadratic_kappa=kappa(x, y)))'''
          new = '''        dimensions.append(dict(dimension=d, n=len(ids), matches=sum(u == v for u, v in zip(x, y)),\n                               agreement=sum(u == v for u, v in zip(x, y))/len(ids)))'''
          if text.count(old) != 1:
              raise SystemExit('failed to patch human-human summary fields')
          text = text.replace(old, new, 1)
          old = '''    metrics = [dict(dimension=r['dimension'], n=r['n'], automatic_human_agreement=r['agreement'],\n                    automatic_human_quadratic_kappa=r['quadratic_kappa']) for r in aligned['dimensions']]'''
          new = '''    metrics = [dict(dimension=r['dimension'], n=r['n'], automatic_human_agreement=r['agreement'])\n               for r in aligned['dimensions']]'''
          if text.count(old) != 1:
              raise SystemExit('failed to patch automatic-human summary fields')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('evaluation/scripts/summarize_final_method.py')
          text = p.read_text(encoding='utf-8')
          if text.count('from summarize_human_confirmation import kappa\n') != 1:
              raise SystemExit('unexpected final summarizer import state')
          text = text.replace('from summarize_human_confirmation import kappa\n', '', 1)
          old = '''        alignment.append(dict(dimension=d,name=base.CRITERIA[d][0],valid=len(a),agreement=sum(x==y for x,y in zip(a,b))/len(a) if a else None,quadratic_kappa=kappa(a,b) if a else None))'''
          new = '''        alignment.append(dict(dimension=d,name=base.CRITERIA[d][0],valid=len(a),agreement=sum(x==y for x,y in zip(a,b))/len(a) if a else None))'''
          if text.count(old) != 1:
              raise SystemExit('failed to patch final-method summary fields')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Regression tests should now assert the actual agreement counts only.
          p = Path('evaluation/tests/test_human_annotation_alignment.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace("    assert summary['dimensions'][5]['quadratic_kappa'] == pytest.approx(0.4838709677419355)\n", '')
          text, n = re.subn(r'\n\ndef test_constant_label_kappa_remains_undefined\(\):.*?(?=\n\ndef test_annotation_totals)', '', text, flags=re.S)
          if n != 1:
              raise SystemExit('failed to remove obsolete statistic regression test')
          p.write_text(text, encoding='utf-8')

          # Remove the field from all tracked CSVs and JSON objects. Also clean legacy JSON string snapshots.
          for p in Path('.').rglob('*.csv'):
              try:
                  raw = p.read_text(encoding='utf-8-sig')
              except UnicodeDecodeError:
                  continue
              reader = csv.DictReader(io.StringIO(raw))
              if not reader.fieldnames:
                  continue
              doomed = [f for f in reader.fieldnames if 'kappa' in f.lower()]
              if doomed:
                  fields = [f for f in reader.fieldnames if f not in doomed]
                  rows = list(reader)
                  out = io.StringIO()
                  w = csv.DictWriter(out, fieldnames=fields, lineterminator='\n')
                  w.writeheader()
                  for row in rows:
                      w.writerow({f: row.get(f, '') for f in fields})
                  p.write_text(out.getvalue(), encoding='utf-8')

          def clean_json(x):
              if isinstance(x, dict):
                  return {k: clean_json(v) for k, v in x.items() if 'kappa' not in str(k).lower()}
              if isinstance(x, list):
                  return [clean_json(v) for v in x]
              if isinstance(x, str):
                  x = x.replace('Independent human agreement/Kappa', 'Independent human agreement')
                  x = x.replace('不是独立人类标注、Kappa或盲评', '不是独立人类标注或盲评')
                  x = x.replace('没有独立人类盲标或 Kappa', '没有独立人类盲标')
                  x = x.replace('双人盲标、逐维二次加权Kappa、通过结论一致率', '双人盲标、逐维等级一致率、通过结论一致率')
                  x = re.sub(r'^\| Hy3 Judge 与人工标签 Weighted Kappa \| ≥ 0\.60 \|\n', '', x, flags=re.M)
                  return x
              return x

          for p in Path('.').rglob('*.json'):
              try:
                  data = json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              cleaned = clean_json(data)
              if cleaned != data:
                  p.write_text(json.dumps(cleaned, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print('metric removed from source/docs/archive text')
          PY

      - name: Regenerate summaries and run focused regression tests
        shell: bash
        run: |
          pip install -r backend/requirements-dev.txt -r evaluation/runtime-requirements.lock
          rm -rf /tmp/human-confirmation-clean /tmp/final-method-clean
          PYTHONPATH=evaluation/src:evaluation/scripts:backend python evaluation/scripts/summarize_human_confirmation.py \
            --annotations 交付材料/人工标注 \
            --archive evaluation/artifacts/decisionbench-final-method-20260910 \
            --output /tmp/human-confirmation-clean
          PYTHONPATH=evaluation/src:evaluation/scripts:backend python evaluation/scripts/summarize_final_method.py \
            --archive evaluation/artifacts/decisionbench-final-method-20260910 \
            --output /tmp/final-method-clean

          cp /tmp/human-confirmation-clean/application-alignment.csv evaluation/artifacts/human-confirmation-20260910/application-alignment.csv
          cp /tmp/human-confirmation-clean/human-human-alignment.csv evaluation/artifacts/human-confirmation-20260910/human-human-alignment.csv
          cp /tmp/human-confirmation-clean/confirmation.json evaluation/artifacts/human-confirmation-20260910/confirmation.json
          cp /tmp/final-method-clean/human-alignment.csv evaluation/artifacts/decisionbench-final-method-20260910/automatic/human-alignment.csv
          cp /tmp/final-method-clean/summary.json evaluation/artifacts/decisionbench-final-method-20260910/automatic/summary.json

          PYTHONPATH=evaluation/src:evaluation/scripts:backend python -m pytest evaluation/tests/test_human_annotation_alignment.py -q
          python scripts/build-final-study-viewer.py

      - name: Regenerate synchronized report, delivery copies, and ZIP
        shell: bash
        run: |
          npm --prefix frontend ci
          node frontend/node_modules/playwright-core/cli.js install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          CHROMIUM_PATH="$(node --input-type=module -e "import { chromium } from './frontend/node_modules/playwright-core/index.mjs'; console.log(chromium.executablePath())")"
          CHROMIUM_PATH="$CHROMIUM_PATH" node scripts/render-stage3-report.mjs .
          python scripts/build-evaluation-delivery.py

      - name: Refresh verification hashes affected by the reporting-schema cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          vpath = Path('evaluation/artifacts/decisionbench-final-method-20260910/verification.json')
          v = json.loads(vpath.read_text(encoding='utf-8'))
          files = v['checks'][0]['files']
          files['human-alignment.csv'] = sha('evaluation/artifacts/decisionbench-final-method-20260910/automatic/human-alignment.csv')
          files['summary.json'] = sha('evaluation/artifacts/decisionbench-final-method-20260910/automatic/summary.json')
          v['report']['source_sha256'] = sha('第三阶段项目与评测报告.md')
          v['report']['html_sha256'] = sha('第三阶段项目与评测报告.html')
          v['report']['pdf_sha256'] = sha('第三阶段项目与评测报告.pdf')
          try:
              pages = subprocess.check_output(['pdfinfo', '第三阶段项目与评测报告.pdf'], text=True)
              for line in pages.splitlines():
                  if line.startswith('Pages:'):
                      v['report']['pages'] = int(line.split(':',1)[1].strip())
                      break
          except Exception:
              pass
          v['report']['visual_review'] = 'Report regenerated from the synchronized Markdown source after removal of an unused agreement statistic; content outside the affected agreement passage is unchanged.'
          v['reporting_schema_note'] = '2026-09-11: removed an unused agreement statistic from reporting and summary schemas; underlying labels, scores, outcomes, and model responses are unchanged.'
          vpath.write_text(json.dumps(v, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          dpath = Path('交付材料/verification.json')
          d = json.loads(dpath.read_text(encoding='utf-8'))
          d['zip_sha256'] = sha('交付材料/评测数据.zip')
          d['reporting_schema_note'] = '2026-09-11: agreement summaries now retain direct agreement only; underlying labels and outcomes are unchanged.'
          dpath.write_text(json.dumps(d, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print('verification hashes refreshed')
          PY

      - name: Verify complete removal, including PDF and delivery ZIP
        shell: bash
        run: |
          rm -f .github/workflows/remove-unused-agreement-metric-oneoff.yml

          if git grep -I -ni -E 'kappa|二次加权|卡帕' -- .; then
            echo 'Found obsolete statistic references above.' >&2
            exit 1
          fi

          pdftotext "第三阶段项目与评测报告.pdf" /tmp/stage3-report.txt
          if grep -E -i 'kappa|二次加权|卡帕' /tmp/stage3-report.txt; then
            echo 'PDF still contains obsolete statistic text.' >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import csv, json, re, zipfile

          forbidden = re.compile(r'kappa|二次加权|卡帕', re.I)

          for p in Path('.').rglob('*.csv'):
              try:
                  with p.open(encoding='utf-8-sig', newline='') as f:
                      fields = next(csv.reader(f), [])
              except Exception:
                  continue
              assert not any(forbidden.search(x or '') for x in fields), p

          def walk(x, path):
              if isinstance(x, dict):
                  for k, v in x.items():
                      assert not forbidden.search(str(k)), (path, k)
                      walk(v, path)
              elif isinstance(x, list):
                  for v in x: walk(v, path)
              elif isinstance(x, str):
                  assert not forbidden.search(x), path

          for p in Path('.').rglob('*.json'):
              try:
                  data = json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              walk(data, p)

          with zipfile.ZipFile('交付材料/评测数据.zip') as z:
              for name in z.namelist():
                  b = z.read(name)
                  try:
                      s = b.decode('utf-8')
                  except UnicodeDecodeError:
                      continue
                  assert not forbidden.search(s), f'ZIP member: {name}'

          assert '二次加权' not in Path('第三阶段项目与评测报告.md').read_text(encoding='utf-8')
          assert not forbidden.search(Path('第三阶段项目与评测报告.html').read_text(encoding='utf-8'))
          print('complete removal verified')
          PY

          git diff --check
          git status --short

      - name: Commit cleaned deliverables
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: remove unsuitable agreement metric"
          git push origin HEAD:main
